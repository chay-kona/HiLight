name: Build HiLight APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3             "platform-tools"             "platforms;android-37.0"             "build-tools;37.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HiLight-Control-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiLight-Control-debug
          path: HiLight-Control-debug.apk
          if-no-files-found: error

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" HiLight-Control-debug.apk             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "HiLight Control Build ${GITHUB_RUN_NUMBER}"             --notes "Automated debug APK build from ${GITHUB_SHA}."             --prerelease
